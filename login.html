<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Biblioteca</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-auth">
  <div class="card">
    <h1>Biblioteca</h1>
    <h2>Entrar</h2>

    <div id="mensagem" class="mensagem" role="alert" hidden></div>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="voce@exemplo.com" autocomplete="username">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required minlength="6" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-bloco" id="btn-entrar">Entrar</button>
    </form>

    <p class="link-alt">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
