<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - Biblioteca Comunitária</title>
</head>
<body data-publica="sim">
  <h1>Cadastro</h1>
  <p id="mensagem"></p>

  <form id="form-cadastro">
    <label>Nome <input type="text" id="nome" required></label><br>
    <label>E-mail <input type="email" id="email" required></label><br>
    <label>Senha <input type="password" id="senha" minlength="6" required></label><br>
    <button type="submit">Cadastrar</button>
  </form>
    <script src="js/api.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
