<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro — Biblioteca</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-auth">
  <div class="card">
    <h1>Biblioteca</h1>
    <h2>Criar conta</h2>

    <div id="mensagem" class="mensagem" role="alert" hidden></div>

    <form id="form-cadastro" novalidate>
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" required minlength="3" maxlength="100" autocomplete="name">
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required maxlength="150" autocomplete="email">
      </div>
      <div class="campo">
        <label for="senha">Senha (mín. 6 caracteres)</label>
        <input type="password" id="senha" required minlength="6" autocomplete="new-password">
      </div>
      <div class="campo">
        <label for="confirmar">Confirmar senha</label>
        <input type="password" id="confirmar" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-bloco" id="btn-cadastrar">Cadastrar</button>
    </form>

    <p class="link-alt">Já tem conta? <a href="login.html">Entrar</a></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
